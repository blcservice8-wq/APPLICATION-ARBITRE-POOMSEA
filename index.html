    font-family:'Segoe UI',Arial,sans-serif;
    min-height:100vh;
  }
  .topbar{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    padding:12px 22px;
    background:linear-gradient(90deg,var(--navy) 0%, var(--navy-deep) 100%);
    border-bottom:3px solid var(--gold);
  }
  .topbar-logo{height:48px;width:48px;object-fit:contain;border-radius:50%;justify-self:center;background:#fff;padding:3px;box-shadow:0 0 0 2px rgba(212,175,55,0.55);}
  .topbar-right{display:flex;align-items:center;gap:10px;justify-self:end;flex-wrap:wrap;}
  @media(max-width:640px){
    .topbar{grid-template-columns:1fr;justify-items:center;text-align:center;}
    .topbar-logo{order:-1;}
    .topbar-right{justify-self:center;}
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,0.18);}
  .brand h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);font-weight:700;}
  .brand small{display:block;color:#9fb0c8;font-size:11px;letter-spacing:.06em;}
  .pill{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:#cdd8e6;letter-spacing:.05em;display:flex;align-items:center;gap:6px;}
  .pill .dotstatus{width:8px;height:8px;border-radius:50%;background:#7e8aa0;}
  .pill.online .dotstatus{background:var(--green);box-shadow:0 0 0 3px rgba(30,142,90,0.25);}
  .pill.offline .dotstatus{background:var(--red);}

  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px;}
  .wrap.wrap-home{max-width:1240px;padding:44px 32px 70px;}
  @media(min-width:900px){
    .wrap-home .space-grid{gap:28px;margin-top:30px;}
    .wrap-home .space-card{padding:60px 30px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .wrap-home .space-icon{font-size:64px;margin-bottom:16px;}
    .wrap-home .space-lbl{font-size:26px;}
    .wrap-home .space-sub{font-size:14px;margin-top:10px;}
    .wrap-home .section-title{font-size:15px;}
    .wrap-home .footer-note{font-size:14px;max-width:760px;margin-left:auto;margin-right:auto;}
  }
  .wrap.wrap-wide{max-width:1180px;}

  /* ---------- SELECTEUR DE ROLE ---------- */
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  @media(max-width:520px){.role-grid{grid-template-columns:1fr;}}

  .space-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px;}
  @media(max-width:820px){.space-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.space-grid{grid-template-columns:1fr;}}
  .space-card{
    border-radius:16px;padding:34px 22px;cursor:pointer;text-align:center;
    border:1px solid rgba(212,175,55,0.35);transition:transform .12s, box-shadow .12s;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    background-size:cover;background-position:center;position:relative;overflow:hidden;
  }

  .space-card.referee{background:linear-gradient(160deg,rgba(212,175,55,0.28),rgba(11,31,58,0.5));}
  .stage-card-row{margin-top:18px;}
  .space-card.stagecard{background:linear-gradient(100deg,rgba(212,175,55,0.22),rgba(0,80,160,0.18),rgba(11,31,58,0.55));padding:26px;}
  .wrap-home .stage-card-row .space-card{min-height:auto;padding:26px;}
  .wrap-home .stage-card-row .space-icon{font-size:40px;margin-bottom:8px;}
  .wrap-home .stage-card-row .space-lbl{font-size:20px;}
  .space-card .space-icon, .space-card .space-lbl, .space-card .space-sub{position:relative;z-index:1;}
  .space-card .space-lbl{text-shadow:0 2px 6px rgba(0,0,0,0.6);}
  .space-icon{font-size:40px;margin-bottom:10px;}
  .space-lbl{color:#fff;font-size:19px;font-weight:800;font-family:Georgia,serif;}
  .space-sub{color:#bcd0ec;font-size:12px;margin-top:6px;}

  .ref-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 22px;}
  @media(max-width:600px){.ref-list{grid-template-columns:1fr;}}
  .ref-card{background:#fff;border-radius:14px;padding:18px 20px;border:1px solid #e5e7eb;}
  .ref-term{font-size:18px;font-weight:800;color:var(--navy);font-family:Georgia,serif;margin-bottom:6px;}
  .ref-desc{font-size:13px;color:#4b5563;line-height:1.5;}

  .admin-tabbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .admin-tab{
    flex:1 1 auto;min-width:120px;padding:10px 12px;border-radius:10px;border:1px solid #d8dce3;
    background:#fff;color:#4b5563;font-size:12px;font-weight:700;cursor:pointer;text-align:center;
  }
  .admin-tab:hover{background:#f1f3f6;}
  .admin-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .ping-panel-wrap{margin-top:16px;}
  .role-card{
    background:linear-gradient(160deg,rgba(255,255,255,0.05),rgba(255,255,255,0.01));
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    cursor:pointer;
    transition:.15s;
  }
  .role-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .role-card .num{font-size:34px;font-weight:800;color:var(--gold);font-family:Georgia,serif;}
  .role-card .lbl{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#cdd8e6;margin-top:6px;}
  .role-card .sub{font-size:11px;color:#7e8aa0;margin-top:4px;}
  .admin-card{grid-column:1/-1;background:linear-gradient(160deg,rgba(200,16,46,0.18),rgba(0,80,160,0.12));border:1px solid rgba(212,175,55,0.4);}
  .screen-card{grid-column:1/-1;background:linear-gradient(160deg,rgba(212,175,55,0.16),rgba(11,31,58,0.3));border:1px solid rgba(212,175,55,0.35);}
  .screen-card .lbl{color:#fff;font-size:15px;font-weight:700;}
  .admin-card .lbl{color:#fff;font-size:15px;font-weight:700;}

  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#9fb0c8;margin:30px 0 10px;}

  /* ---------- CARTE GENERIQUE ---------- */
  .card{
    background:#fff;color:var(--ink);
    border-radius:14px;padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    margin-bottom:16px;
  }
  .backlink{display:inline-flex;align-items:center;gap:6px;color:#9fb0c8;font-size:13px;text-decoration:none;cursor:pointer;margin-bottom:14px;}
  .backlink:hover{color:var(--gold);}

  label.field-label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin-bottom:6px;font-weight:700;}
  input[type=text]{
    width:100%;padding:10px 12px;border:1px solid #d8dce3;border-radius:8px;font-size:15px;
  }
  select.field-select{
    width:100%;padding:10px 12px;border:1px solid #d8dce3;border-radius:8px;font-size:15px;background:#fff;color:var(--ink);
  }
  .field-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .judges-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .judges-edit-grid .jn-item label{display:block;font-size:11px;color:#6b7280;font-weight:700;margin-bottom:4px;}

  .sbs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:680px){ .sbs-grid{grid-template-columns:1fr;} }

  .athlete-banner{
    background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:12px;
    padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;
  }
  .athlete-banner .name{font-size:18px;font-weight:800;font-family:Georgia,serif;}
  .athlete-banner .tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#bcd0ec;}
  .athlete-banner .meta{font-size:12px;color:#dce6f5;margin-top:2px;}
  .athlete-banner.waiting{background:#eceef1;color:#6b7280;}
  .athlete-banner.waiting .name{color:#6b7280;font-size:14px;}

  .score-block{border-top:1px solid #eceef1;padding-top:16px;margin-top:16px;}
  .score-head{display:flex;justify-content:space-between;align-items:baseline;}
  .score-head h3{margin:0;font-size:15px;}
  .score-head .max{font-size:12px;color:#9098a3;}
  .score-value{font-size:30px;font-weight:800;font-family:Georgia,serif;color:var(--navy);margin:8px 0;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;
    transition:.12s;
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-faute1{background:#fde7ea;color:var(--red);}
  .btn-faute1:hover{background:#f8c9d0;}
  .btn-faute3{background:var(--red);color:#fff;}
  .btn-faute3:hover{background:#a30d24;}
  .btn-plus{background:#e8f0fb;color:var(--blue);}
  .btn-plus:hover{background:#cfe0f6;}
  .btn-minus{background:#eef0f3;color:#4b5563;}
  .btn-minus:hover{background:#dde1e6;}
  .btn-reset{background:none;color:#9098a3;text-decoration:underline;padding:6px 0;}

  .total-bar{
    margin-top:22px;background:var(--navy);color:#fff;border-radius:12px;
    padding:18px;display:flex;justify-content:space-between;align-items:center;
  }
  .total-bar .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#9fb0c8;}
  .total-bar .num{font-size:36px;font-weight:800;font-family:Georgia,serif;color:var(--gold);}

  .btn-validate{
    width:100%;margin-top:16px;padding:14px;border-radius:10px;border:none;
    background:var(--gold);color:var(--navy-deep);font-weight:800;font-size:15px;letter-spacing:.04em;cursor:pointer;
  }
  .btn-validate:hover{background:#c79f2e;}

  /* ---------- Mode Freestyle : sliders technique/présentation + déductions ---------- */
  .fs-slider-row{display:grid;grid-template-columns:1fr 3fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f2f5;}
  .fs-slider-row:last-of-type{border-bottom:none;}
  .fs-label{font-size:13px;font-weight:700;color:var(--ink);}
  .fs-slider-row input[type=range]{width:100%;accent-color:var(--green);}
  .fs-val{font-size:16px;font-weight:800;font-family:Georgia,serif;color:var(--green);min-width:34px;text-align:right;}
  @media (max-width:560px){ .fs-slider-row{grid-template-columns:1fr;gap:4px;} .fs-val{text-align:left;} }

  .deduction-checks{display:flex;flex-wrap:wrap;gap:18px;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
  .checkline input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);}
  input[type=number].field-select{width:100%;}
  .deduction-bar{background:#c8102e;}
  .deduction-bar .num{color:#fff;}

  /* ---------- Précision unifiée (side-by-side) ---------- */
  .precision-title{font-weight:800;font-size:17px;color:var(--ink);margin-bottom:2px;}
  .precision-sub{font-size:13px;color:#6b7280;margin-bottom:12px;}
  .precision-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
  .precision-btn{border:none;border-radius:10px;padding:16px 6px;font-size:16px;font-weight:800;cursor:pointer;color:#fff;}
  .precision-btn.red{background:var(--red);}
  .precision-btn.red:hover{background:#a30d24;}
  .precision-btn.blue{background:var(--blue);}
  .precision-btn.blue:hover{background:#003b78;}
  .precision-value{border-radius:10px;background:#fff;border:1px solid #eceef1;display:flex;align-items:center;justify-content:center;}
  .precision-value .num{font-size:34px;font-weight:800;font-family:Georgia,serif;}
  .precision-value.red .num{color:var(--red);}
  .precision-value.blue .num{color:var(--blue);}
  @media (max-width:520px){ .precision-row{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;} }

  /* ---------- Colonnes de critères (choix de note) ---------- */
  .criteria-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:680px){ .criteria-columns{grid-template-columns:1fr;} }
  .criteria-columns > div{min-width:0;}
  .crit-label{font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 8px;}
  .score-options{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scroll-snap-type:x proximity;
    width:100%;min-width:0;max-width:100%;box-sizing:border-box;
    /* Affiche par défaut environ 6 valeurs (jusqu'à 1.5) ; le reste (1.4 → 0.5) est
       accessible en glissant horizontalement sans jamais déborder du cadre de la carte. */
    max-width:min(100%, 348px);
    mask-image:linear-gradient(to right, black 88%, transparent 100%);
    -webkit-mask-image:linear-gradient(to right, black 88%, transparent 100%);
  }
  .score-opt{flex:0 0 52px;scroll-snap-align:start;border:none;border-radius:8px;padding:12px 4px;font-size:14px;font-weight:800;cursor:pointer;background:#eceef1;color:#6b7280;}
  .score-opt.red.active{background:var(--red);color:#fff;}
  .score-opt.blue.active{background:var(--blue);color:#fff;}

  .side-totals-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}
  @media (max-width:680px){ .side-totals-row{grid-template-columns:1fr;} }
  .side-totals{display:flex;justify-content:space-between;align-items:baseline;}
  .side-totals .t-precision{color:var(--green);font-weight:800;font-size:19px;font-family:Georgia,serif;}
  .side-totals .t-presentation{color:var(--blue);font-weight:800;font-size:19px;font-family:Georgia,serif;}
  .side-totals .t-max{color:#d4770e;font-weight:800;font-size:17px;font-family:Georgia,serif;}

  .sbs-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px;}
  @media (max-width:520px){ .sbs-actions{grid-template-columns:1fr;} }
  .btn-sbs{border:none;border-radius:10px;padding:14px 8px;font-weight:800;font-size:14px;color:#fff;cursor:pointer;background:var(--green);}
  .btn-sbs:hover{opacity:.9;}
  .btn-sbs.secondary{background:#6b7280;}

  .btn-send{
    width:100%;margin-top:10px;padding:13px;border-radius:10px;border:2px solid var(--blue);
    background:#fff;color:var(--blue);font-weight:800;font-size:14px;letter-spacing:.03em;cursor:pointer;
  }
  .btn-send:hover{background:var(--blue);color:#fff;}
  .send-status{
    margin-top:14px;padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:700;
    text-align:center;letter-spacing:.02em;
  }
  .send-status.ok{background:#e4f6ea;color:#1a7a3c;}
  .send-status.sending{background:#fff3cd;color:#8a6d00;}
  .send-status.pending{background:#fdeaea;color:#a12626;}

  .validated-banner{
    background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:14px;
    padding:34px 22px;text-align:center;
  }
  .validated-banner .who{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#bcd0ec;}
  .validated-banner .score{font-size:64px;font-weight:800;font-family:Georgia,serif;color:var(--gold);margin:10px 0;}
  .validated-banner .hint{font-size:13px;color:#cdd8e6;}
  .btn-edit{margin-top:18px;background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;}

  /* ---------- DOUBLE POOMSAE (P1 / P2) ---------- */
  .poomsae-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .poomsae-tab{
    flex:1;padding:11px 8px;border-radius:10px;border:2px solid #e3e6ea;background:#fff;
    color:#4b5563;font-weight:700;font-size:13px;cursor:pointer;text-align:center;transition:.12s;
  }
  .poomsae-tab.active{border-color:var(--navy);background:var(--navy);color:#fff;}
  .poomsae-recap{display:flex;gap:16px;justify-content:center;margin:6px 0;font-size:12px;color:#cdd8e6;}
  .poomsae-edit-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .poomsae-edit-row .btn-edit{margin-top:12px;}

  /* ---------- ADMIN / ECRAN CENTRAL ---------- */
  .athlete-input{display:flex;gap:10px;}
  .athlete-input input{flex:1;}
  .btn-new{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .btn-new:hover{background:#003d7a;}

  .judges-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  @media(max-width:520px){.judges-grid{grid-template-columns:1fr;}}
  .judge-slot{border:1px solid #e3e6ea;border-radius:10px;padding:12px;position:relative;}
  .judge-slot.is-validated{border-color:var(--green);background:#f3fbf6;}
  .judge-slot .jt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;}
  .judge-slot .jt .stat{font-size:10px;font-weight:700;}
  .judge-slot .jt .stat.wait{color:#c79b1f;}
  .judge-slot .jt .stat.ok{color:var(--green);}
  .judge-slot .val{font-size:24px;font-weight:800;color:var(--navy);}
  .judge-slot .val.pending{color:#c2c8d1;font-size:15px;font-weight:600;}

  .btn-calc{
    width:100%;margin-top:18px;padding:15px;border-radius:10px;border:none;
    background:var(--navy);color:#fff;font-weight:800;font-size:15px;letter-spacing:.04em;cursor:pointer;
  }
  .btn-calc:hover{background:var(--blue);}
  .btn-calc:disabled{background:#c2c8d1;cursor:not-allowed;}

  .mode-toggle{display:flex;gap:10px;flex-wrap:wrap;}
  .mode-btn{flex:1;min-width:170px;padding:14px;border-radius:10px;border:2px solid #e3e6ea;background:#fff;color:#4b5563;font-weight:700;font-size:13px;cursor:pointer;text-align:center;transition:.12s;}
  .mode-btn.active{border-color:var(--navy);background:var(--navy);color:#fff;}

  .pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  @media(max-width:480px){.pick-grid{grid-template-columns:1fr;}}
  .pick-btn{padding:26px 12px;border-radius:14px;border:3px solid #e3e6ea;background:#fff;cursor:pointer;text-align:center;transition:.12s;}
  .pick-btn:active{transform:scale(.97);}
  .pick-btn .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  .pick-btn.side-a .tag{color:var(--red);}
  .pick-btn.side-b .tag{color:var(--blue);}
  .pick-btn.side-a.selected{border-color:var(--red);background:#fde7ea;}
  .pick-btn.side-b.selected{border-color:var(--blue);background:#e8f0fb;}
  .pick-btn .pname{font-size:19px;font-weight:800;color:var(--ink);margin-top:8px;}

  .vs-row{display:flex;gap:20px;align-items:stretch;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .vs-side{padding:20px 30px;border-radius:16px;border:3px solid var(--line);min-width:180px;}
  .vs-side.winner{border-color:var(--gold);box-shadow:0 0 30px rgba(212,175,55,0.25);}
  .vs-side.a{background:rgba(200,16,46,0.12);}
  .vs-side.b{background:rgba(0,80,160,0.15);}
  .vs-side .tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;}
  .vs-side.a .tag{color:#f3b7bd;}
  .vs-side.b .tag{color:#bcd0ec;}
  .vs-side .vname{font-size:30px;font-weight:800;font-family:Georgia,serif;color:#fff;margin:6px 0;}
  .vs-side .votes{font-size:20px;color:var(--gold);font-weight:800;}
  .vs-mid{display:flex;align-items:center;font-size:22px;color:#7e8aa0;font-weight:700;}

  /* ---------- Scoreboard fin de round (side-by-side) ---------- */
  .sb-board{width:100%;max-width:920px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.15);background:#0c1524;}
  .sb-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;font-size:18px;font-weight:800;color:#fff;}
  .sb-topbar .sb-round{color:var(--gold);}
  .sb-headers{display:flex;}
  .sb-head{flex:1;display:flex;align-items:center;gap:10px;padding:12px 20px;font-size:19px;font-weight:800;color:#fff;}
  .sb-head.a{background:rgba(200,16,46,0.55);justify-content:flex-start;}
  .sb-head.b{background:rgba(0,80,160,0.55);justify-content:flex-end;}
  .sb-flag{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;background:rgba(255,255,255,0.18);}
  .sb-mid{display:flex;background:#05090f;}
  .sb-avgcol{flex:1;padding:18px 16px;text-align:center;}
  .sb-avgcol.a{background:rgba(200,16,46,0.16);}
  .sb-avgcol.b{background:rgba(0,80,160,0.16);}
  .sb-avg{font-size:52px;font-weight:800;font-family:Georgia,serif;color:var(--gold);line-height:1;}
  .sb-avglabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9fb0c8;margin-top:4px;}
  .sb-judges{flex:0 0 60px;display:flex;flex-direction:column;justify-content:center;}
  .sb-jrow{display:flex;align-items:center;justify-content:center;font-size:12px;color:#cdd8e6;padding:2px 0;gap:6px;}
  .sb-jnum{width:20px;height:20px;border-radius:4px;background:var(--gold);color:var(--navy-deep);font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:11px;}
  .sb-jval{width:60px;}
  .sb-jval.acc{color:#9fb0c8;}
  .sb-jval.pres{color:#e07a2b;}
  .sb-summary{display:flex;justify-content:space-between;padding:10px 22px;background:#0c1524;}
  .sb-sumcol{display:flex;gap:14px;font-size:13px;color:#9fb0c8;}
  .sb-sumcol b{font-size:16px;font-family:Georgia,serif;}
  .sb-sumcol .acc b{color:#8ab4f8;}
  .sb-sumcol .tot b{color:#fff;}
  .sb-sumcol .pres b{color:#e07a2b;}
  .sb-botbar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;background:#111c30;border-top:1px solid rgba(255,255,255,0.1);}
  .sb-poomsae{display:flex;gap:8px;align-items:center;font-size:13px;color:#cdd8e6;}
  .sb-poomsae .rlabel{background:var(--gold);color:var(--navy-deep);font-weight:800;border-radius:6px;padding:2px 8px;font-size:12px;}
  .sb-poomsae.dim{opacity:.45;}
  .sb-winnerbar{margin-top:22px;padding:14px 30px;border-radius:12px;background:rgba(212,175,55,0.14);border:1px solid var(--gold);color:var(--gold);font-size:20px;font-weight:800;}

  /* ---------- Tableau side-by-side pendant le temps d'exécution (avant les notes) ---------- */
  .jp-board{display:flex;width:100%;max-width:1180px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,0.18);box-shadow:0 20px 50px rgba(0,0,0,0.45);}
  .jp-col{flex:1;min-height:260px;padding:44px 28px;display:flex;align-items:center;justify-content:center;text-align:center;}
  .jp-col.red{background:linear-gradient(160deg,#8a1226,#c8102e);}
  .jp-col.blue{background:linear-gradient(160deg,#003158,#0050a0);}
  .jp-name{color:#fff;font-size:38px;font-weight:800;font-family:Georgia,serif;line-height:1.3;}
  .jp-judges{flex:0 0 100px;background:#0a1220;display:flex;flex-direction:column;}
  .jp-num{flex:1;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:24px;font-weight:800;border-bottom:1px solid rgba(255,255,255,0.08);}
  .jp-num:last-child{border-bottom:none;}
  @media(max-width:560px){ .jp-col{padding:24px 12px;min-height:160px;} .jp-name{font-size:22px;} .jp-judges{flex-basis:56px;} .jp-num{font-size:15px;} }

  /* Grand chrono numérique affiché sous le tableau, synchronisé avec l'Espace Admin. */
  .jp-big-chrono{
    margin-top:34px;font-size:96px;font-weight:800;font-family:Georgia,serif;color:#cdd8e6;
    letter-spacing:.02em;transition:.15s;
  }
  .jp-big-chrono.running{color:var(--gold);text-shadow:0 0 40px rgba(212,175,55,0.35);}
  @media(max-width:560px){ .jp-big-chrono{font-size:56px;margin-top:22px;} }

  /* ---------- ECRAN DE PROJECTION ---------- */
  .stage{display:none;}
  .stage.active{
    display:flex;position:fixed;inset:0;z-index:50;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;

  }
  .stage-logo{width:150px;height:150px;object-fit:contain;border-radius:50%;background:#fff;padding:8px;
    box-shadow:0 0 0 3px rgba(212,175,55,0.6), 0 12px 34px rgba(0,0,0,0.45);margin-bottom:16px;}
  .stage-slogan{position:absolute;bottom:26px;left:0;right:0;text-align:center;
    font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.92;}
  .stage .league{font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .stage .athlete-name{font-size:64px;font-weight:800;color:#fff;font-family:Georgia,serif;margin-bottom:40px;}
  .stage .final{font-size:160px;font-weight:800;font-family:Georgia,serif;color:var(--gold);line-height:1;text-shadow:0 0 60px rgba(212,175,55,0.4);}
  .stage .final-label{font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#9fb0c8;margin-top:14px;}
  .stage .breakdown{display:flex;gap:18px;margin-top:40px;flex-wrap:wrap;justify-content:center;}
  .stage .bd-item{padding:10px 16px;border-radius:10px;font-size:15px;font-weight:700;}
  .bd-kept{background:rgba(212,175,55,0.15);color:var(--gold);border:1px solid rgba(212,175,55,0.4);}
  .bd-dropped{background:rgba(255,255,255,0.04);color:#7e8aa0;border:1px solid var(--line);text-decoration:line-through;}
  .stage-titlebar{position:absolute;top:20px;right:24px;z-index:5;display:flex;gap:8px;background:rgba(20,26,38,0.6);border:1px solid var(--line);border-radius:10px;padding:6px;backdrop-filter:blur(4px);}
  .stage-titlebar button{
    width:34px;height:30px;border:none;border-radius:6px;cursor:pointer;
    background:rgba(255,255,255,0.08);color:#e7ecf3;font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .stage-titlebar button:hover{background:rgba(255,255,255,0.18);}
  .stage-titlebar button.tb-close:hover{background:#c8102e;}
  .stage .waiting{font-size:20px;color:#9fb0c8;}
  .stage:fullscreen{background:#05090f;}
  .stage.has-scoreboard .stage-chrono{display:none;}
  .stage-chrono{
    position:absolute;top:26px;left:28px;
    font-size:44px;font-weight:800;font-family:Georgia,serif;color:#cdd8e6;
    background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:16px;
    padding:8px 22px;letter-spacing:.02em;transition:.15s;
  }
  .stage-chrono.running{color:var(--gold);border-color:var(--gold);box-shadow:0 0 24px rgba(212,175,55,0.25);}
  .stage-logo{margin-top:4px;}
  .stage .league{margin-top:2px;margin-bottom:22px;}

  /* ---------- ACCÈS ADMIN (bouton discret, distinct des cartes juges) ---------- */
  .btn-admin-access{
    display:block;margin:22px auto 0;padding:10px 18px;background:transparent;
    color:#8296b8;border:1px solid var(--line);border-radius:10px;font-size:13px;
    cursor:pointer;letter-spacing:.02em;transition:.15s;
  }
  .btn-admin-access:hover{color:var(--paper);border-color:#8296b8;background:rgba(255,255,255,0.04);}

  /* ---------- FENÊTRE ESPACE ADMIN (modale plein écran, masquée aux juges) ---------- */
  .admin-modal-overlay{display:none;}
  .admin-modal-overlay.active{
    display:flex;position:fixed;inset:0;z-index:90;align-items:flex-start;justify-content:center;
    background:rgba(6,12,24,0.72);padding:26px 14px;overflow-y:auto;
  }
  .admin-modal-panel{
    width:100%;max-width:640px;background:var(--navy);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,0.5);margin-bottom:26px;
  }
  .admin-modal-header{
    position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--line);background:var(--navy-deep);
    border-radius:16px 16px 0 0;z-index:2;
  }
  .admin-modal-title{font-size:15px;font-weight:800;color:var(--paper);letter-spacing:.02em;}
  .admin-modal-close{
    background:rgba(255,255,255,0.08);color:#fff;border:1px solid var(--line);
    border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;
  }
  .admin-modal-close:hover{background:rgba(255,255,255,0.16);}
  .admin-modal-body{padding:18px 18px 24px;}

  /* ---------- ACCÈS JUGE — mini panneau signal test ---------- */
  .judge-test-signal{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;
    border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;
  }
  .judge-test-signal button{
    background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 12px;
    font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  .judge-test-signal .status{color:#6b7280;}
  .judge-test-signal .status.fresh{color:#166534;font-weight:700;}

  .history{margin-top:26px;}
  .history table{width:100%;border-collapse:collapse;font-size:13px;}
  .history th{text-align:left;color:#9098a3;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid #eceef1;}
  .history td{padding:8px;border-bottom:1px solid #f1f2f4;}
  .history .empty{color:#9098a3;font-size:13px;padding:14px 0;}

  .footer-note{text-align:center;color:#5d6b85;font-size:12px;margin-top:34px;line-height:1.6;}
  .config-warning{background:#3a1f1f;border:1px solid var(--red);color:#ffd9dc;border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:16px;line-height:1.6;}
  .ping-panel{margin-top:24px;padding:18px;background:#fff;border-radius:14px;border:1px solid #e5e7eb;}
  .ping-status{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:14px;}
  .ping-empty{background:#f3f4f6;color:#6b7280;}
  .ping-fresh{background:#dcfce7;color:#166534;font-weight:700;}
  .ping-old{background:#fef3c7;color:#92400e;}
</style>
</head>

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function attemptLogin(){
  loginError = '';
  loginChecking = true;
  render();
  const userOk = loginUsernameInput.trim().toLowerCase() === AUTH_USERNAME.toLowerCase();
  const passHash = await sha256Hex(loginPasswordInput);
  loginChecking = false;
  if(userOk && passHash === AUTH_PASSWORD_HASH){
    sessionStorage.setItem(AUTH_SESSION_KEY, '1');
    loginPasswordInput = '';
    view = 'home';
  } else {
    loginError = 'Identifiant ou mot de passe incorrect.';
  }
  render();
}

function logout(){
  sessionStorage.removeItem(AUTH_SESSION_KEY);
  sessionStorage.removeItem(ADMIN_SESSION_KEY);
  adminUnlocked = false;
  adminModalOpen = false;
  view = 'login';
  render();

let db = null;
let firebaseReady = false;
let lastFirestoreError = null; // message affiché en clair à l'écran (au lieu de dépendre d'une alerte)

function initFirebase(){
  if(window.__sdkLoadError){
    lastFirestoreError = window.__sdkLoadError;
    debugInfo.lastError = lastFirestoreError;
    document.getElementById('topPillText').textContent = 'Erreur de connexion';
    document.getElementById('topPill').classList.add('offline');
    return;
  }
  if(firebaseConfig.apiKey === "REMPLACE_MOI"){
    document.getElementById('topPillText').textContent = 'Config Firebase manquante';
    document.getElementById('topPill').classList.add('offline');
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
 // Force le mode "long polling": certains réseaux mobiles/proxys coupent le flux
 // temps réel (WebChannel) après le tout premier message, ou empêchent même la détection
 // automatique de basculer correctement. On force le long-polling dès le départ
 // plutôt que de laisser Firestore essayer d'abord le WebSocket (plus fiable en 4G/proxy).
    db.settings({
      experimentalForceLongPolling: true,
      experimentalAutoDetectLongPolling: false,
      merge: true
    });
    firebaseReady = true;
    document.getElementById('topPillText').textContent = 'Connexion en cours…';
    listenSession();
    listenNotes();
    listenJudges();
    listenPing();
    startPollingFallback();
  }catch(e){
    console.error('Erreur d\'initialisation Firebase :', e);
    lastFirestoreError = (e && e.code ? e.code + ' — ' : '') + (e && e.message ? e.message : String(e));
    debugInfo.lastError = lastFirestoreError;
    document.getElementById('topPillText').textContent = 'Erreur de connexion';
    document.getElementById('topPill').classList.add('offline');
  }
}

/* =========================================================
   CHRONO DE PASSAGE — temps d'exécution de l'athlète
   Chrono purement local (pas de synchro Firestore) : contrôlé depuis
   l'écran admin, affiché en direct sur l'admin ET sur l'écran central.
========================================================= */
let chronoState = { running:false, startEpoch:null, elapsedMs:0 };
let chronoTickInterval = null;

function chronoCurrentMs(){
  if(chronoState.running && chronoState.startEpoch){
    return chronoState.elapsedMs + (Date.now() - chronoState.startEpoch);
  }
  return chronoState.elapsedMs;
}

function formatChrono(ms){
 const totalDs = Math.max(0, Math.floor(ms / 100)); // dixièmes de seconde
  const min = Math.floor(totalDs / 600);
  const sec = Math.floor((totalDs % 600) / 10);
  const ds = totalDs % 10;
  return min + ':' + String(sec).padStart(2,'0') + '.' + ds;
}

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

/* =========================================================
   DOUBLE POOMSAE (P1 + P2) — chaque athlète exécute deux Poomsae ;
   chaque juge note les deux séparément puis envoie la MOYENNE des deux
   à l'admin. Même structure réutilisée en mode Simple élimination
   (un athlète) et en Side by side (athlètes A et B, chacun avec son P1/P2).
========================================================= */
function makeEmptyPass(){
  return { precision: 4.0, faultsLog: [], puissance: 2.0, rythme: 2.0, expression: 2.0, validated: false };
}
function makeEmptyDoubleState(){
  return { phase: 1, p1: makeEmptyPass(), p2: makeEmptyPass() };
}
function passTotal(pass){
  return round1(pass.precision + pass.puissance + pass.rythme + pass.expression);
}
// Note moyenne des deux Poomsae (P1 + P2) — c'est CETTE valeur qui est envoyée à l'admin.
function doubleAverage(state){
  return round1((passTotal(state.p1) + passTotal(state.p2)) / 2);
}
function currentPass(state){
  return state.phase === 1 ? state.p1 : state.p2;
}
function bothPassesValidated(state){
  return state.p1.validated && state.p2.validated;
}
// Moyenne d'UN critère (precision/puissance/rythme/expression) entre P1 et P2 — c'est ce
// qui est envoyé à l'admin champ par champ, en plus du total, pour rester compatible avec
// le calcul admin existant (dépose note mini/maxi puis moyenne des 3 restantes).
function avgPassField(state, field){
  return round1((state.p1[field] + state.p2[field]) / 2);
}

let judgeState = makeEmptyDoubleState();
function resetJudgeState(){
  judgeState = makeEmptyDoubleState();
}
function judgeTotal(){
  return doubleAverage(judgeState);
}

// ---------- Mode 'freestyle' : Technique (6.0) + Présentation (4.0) − Déductions ----------
const FREESTYLE_TECH_CRITERIA = [
  {key:'hauteur', label:'Hauteur du coup de pied latéral sauté'},
  {key:'multi', label:'Plusieurs coups de pied en un saut'},
  {key:'rotation', label:'Niveau de rotation dans un coup de pied tournant'},
  {key:'kyorugi', label:'Coups de pied consécutifs style Kyorugi'},
  {key:'acro', label:'Technique de coups de pied acrobatiques'},
  {key:'base', label:'Mouvements de base et praticabilité'},
];
function makeEmptyFreestyleState(){
  return {
    technique: {hauteur:0, multi:0, rotation:0, kyorugi:0, acro:0, base:0},
    presentation: 0,
    hakdari:false, beom:false, dwitkubi:false, limitCrossings:0, offTime:false,
    validated:false
  };
}
let judgeFreestyle = makeEmptyFreestyleState();
function freestyleTechniqueTotal(fs){
  const t = fs.technique;
  return round1(Math.min(6.0, t.hauteur+t.multi+t.rotation+t.kyorugi+t.acro+t.base));
}
// 0.3 par posture obligatoire manquée (Hakdari/Beom/Dwitkubi) ou franchissement de limite,
// 1.0 si la performance sort de la fenêtre 90-100 secondes.
function freestyleDeductionsTotal(fs){
  return round1((fs.hakdari?0.3:0) + (fs.beom?0.3:0) + (fs.dwitkubi?0.3:0) + (fs.limitCrossings||0)*0.3 + (fs.offTime?1.0:0));
}
function freestyleRawTotal(fs){
  return round1(freestyleTechniqueTotal(fs) + clamp(round1(fs.presentation), 0, 4.0));
}
function freestyleFinalTotal(fs){
  return clamp(round1(freestyleRawTotal(fs) - freestyleDeductionsTotal(fs)), 0, 10);
}
function resetFreestyleState(){
  judgeFreestyle = makeEmptyFreestyleState();
}

// Etat du juge en mode 'sideBySide': un état double P1/P2 complet pour CHACUN des
// deux athlètes A et B. En side-by-side, les deux athlètes exécutent leur Poomsae 1
// PUIS leur Poomsae 2 en même temps (compétition simultanée): la phase (P1/P2) est
// commune aux deux athlètes, contrairement au champ.phase individuel de
// makeEmptyDoubleState (non utilisé ici).
let judgeStateA = makeEmptyDoubleState();
let judgeStateB = makeEmptyDoubleState();
let sidePhase = 1;

function resetSideStates(){
  judgeStateA = makeEmptyDoubleState();
  judgeStateB = makeEmptyDoubleState();
  sidePhase = 1;
}
// Renvoie la moyenne P1/P2 pour un état côté side-by-side (utilisé pour A et B).
function sideTotal(state){
  return doubleAverage(state);
}
// Passe éditée pour un athlète en side-by-side (pilotée par sidePhase, commun aux 2).
function currentSidePass(state){
  return sidePhase === 1 ? state.p1 : state.p2;
}
function bothSidePassesValidated(){
  return judgeStateA.p1.validated && judgeStateA.p2.validated && judgeStateB.p1.validated && judgeStateB.p2.validated;
}

function sessionRef(){

}
// Chaque juge a SON PROPRE document indépendant (poomsae/current/notes/j1..j5).
// Ainsi, l'écriture d'un juge ne dépend jamais d'une écriture concurrente d'un autre juge
// sur un même champ partagé.
function notesRef(){
  return sessionRef().collection('notes');
}
function pingRef(){
  return db.collection('poomsae').doc('ping_test');
}
// Document indépendant et persistant (jamais réinitialisé par un nouveau match/athlète)
// stockant le nom attribué à chacun des 5 juges.
function judgesRef(){
  return db.collection('poomsae').doc('judges');
}
// Compteur atomique du numéro de match, utilisé pour la colonne "N° de match" de
// l'historique (incrémenté via transaction Firestore, jamais réinitialisé).
function matchCounterRef(){
  return db.collection('poomsae').doc('meta_counters');
}
function nextMatchNumber(){
  return db.runTransaction(tx => {
    return tx.get(matchCounterRef()).then(doc => {
      const current = (doc.exists && typeof doc.data().matchNumber === 'number') ? doc.data().matchNumber : 0;
      const next = current + 1;
      tx.set(matchCounterRef(), { matchNumber: next }, {merge:true});
      return next;
    });
  });
}

/* =========================================================
   TEST DE CONNEXION (diagnostic synchro PC <-> téléphone)
========================================================= */
let pingData = null; // { from, sentAt(ms), receivedAt(ms) }
let pingTickInterval = null;

function deviceGuess(){
  const ua = navigator.userAgent || '';
  return /Mobile|Android|iPhone/i.test(ua) ? '📱 Téléphone' : '🖥️ Ordinateur';
}

function listenPing(){
  pingRef().onSnapshot(doc => {
    if(!doc.exists){ pingData = null; if(view === 'home' && !formEditingActive) render(); return; }
    const d = doc.data();
    pingData = {
      from: d.from || '?',
      sentAtMs: d.sentAt && d.sentAt.toMillis ? d.sentAt.toMillis() : null
    };
    if(view === 'home' && !formEditingActive) render();
  }, err => {
    console.error('Erreur Firestore (ping) :', err.code, err.message);
    lastFirestoreError = 'Lecture du signal test bloquée : ' + err.code + ' — ' + err.message;
    if(view === 'home' && !formEditingActive) render();
  });
  if(!pingTickInterval){
    // Ce tic ne doit JAMAIS interrompre une saisie en cours (Athlète/Catégorie/Poomsae,

    pingTickInterval = setInterval(() => { if(view === 'home' && !formEditingActive) render(); }, 1000);
  }
}

function renderPingPanel(){

    body = `<div class="ping-status ping-empty">Aucun signal de test envoyé pour l'instant.</div>`;
  } else {
    const secs = Math.max(0, Math.round((Date.now() - pingData.sentAtMs) / 1000));
    const fresh = secs <= 5;
    const timeLabel = secs < 60 ? `il y a ${secs}s` : `il y a ${Math.round(secs/60)} min`;
    body = `<div class="ping-status ${fresh ? 'ping-fresh' : 'ping-old'}">
      Dernier signal reçu : envoyé depuis <b>${escapeHtml(pingData.from)}</b> — ${timeLabel}

  return `

      <div class="section-title" style="margin-top:0;">📡 Test de connexion PC ↔ Téléphone</div>

/* =========================================================
   FILET DE SECURITE — relecture périodique directe (sans streaming)
   En complément du onSnapshot temps réel, on relit le document toutes les
   3s via une requête HTTPS classique (.get). Si le flux temps réel est
   bloqué par un proxy/réseau (cas fréquent en 4G), ceci garantit quand
   même l'arrivée des notes avec au plus 3s de retard.
========================================================= */
let pollingInterval = null;
let isRefreshing = false;
let debugInfo = {
  lastSessionReadAt: null,
  lastNotesReadAt: null,
  notesSource: '—',
  lastError: null
};

// Les mises à jour temps réel (notes des juges, session) peuvent arriver plusieurs fois
// par seconde pendant la notation. Un render immédiat à chaque fois recrée le DOM et
// referme les menus déroulants (ex. choix de la catégorie) en plein milieu de la saisie.
// On regroupe ces rafraîchissements "silencieux" avec un court délai, pour laisser
// le temps de faire un choix tranquillement dans l'Espace Admin.
let liveRenderTimeout = null;
// Certains champs (phase, catégories A/B, poomsae round) sont des menus déroulants
// ou des saisies libres : si un rafraîchissement live les recrée pendant que l'admin
// est en train de choisir/écrire, le menu se referme et la saisie est interrompue.
// Tant qu'un de ces champs a le focus, on repousse indéfiniment le rendu (délai illimité) ;
// il se déclenche dès que l'admin quitte le champ (blur).
let formEditingActive = false;
function scheduleLiveRender(){
  if(liveRenderTimeout) clearTimeout(liveRenderTimeout);
  liveRenderTimeout = setTimeout(function tick(){
    if(formEditingActive){
      liveRenderTimeout = setTimeout(tick, 1200);
      return;
    }
    liveRenderTimeout = null;
    render();
  }, 1200);
}

function applySessionData(data){
  session.mode = data.mode || 'single';
  session.phase = data.phase || '';
  session.athleteName = data.athleteName || '';
  session.athleteCategory = data.athleteCategory || '';
  session.athleteWeight = data.athleteWeight || '';
  session.athleteA = data.athleteA || '';
  session.athleteB = data.athleteB || '';
  session.athleteACategory = data.athleteACategory || '';
  session.athleteAWeight = data.athleteAWeight || '';
  session.athleteBCategory = data.athleteBCategory || '';
  session.athleteBWeight = data.athleteBWeight || '';
  session.poomsaeR1 = data.poomsaeR1 || '';
  session.poomsaeR2 = data.poomsaeR2 || '';
  session.resetToken = data.resetToken || 0;
  session.final = data.final || null;
  if(view === 'judge' && session.resetToken !== lastSeenResetToken){
    lastSeenResetToken = session.resetToken;
    resetJudgeState();
    resetSideStates();
    judgeHydrated = true;
    writeJudgeScore();
  }
  scheduleLiveRender();
}

function startPollingFallback(){
  if(pollingInterval) return;
  pollingInterval = setInterval(() => {
    if(!firebaseReady) return;
    sessionRef().get({source:'server'}).then(doc => {
      const data = doc.exists ? doc.data() : { athleteName:'', resetToken:0, final:null };
      debugInfo.lastSessionReadAt = new Date();
      applySessionData(data);
    }).catch(err => {
      console.warn('Relecture périodique (session) impossible :', err.code, err.message);
    });
    notesRef().get({source:'server'}).then(qs => {
      const scores = {};
      qs.forEach(d => { scores[d.id] = d.data(); });
      session.scores = scores;
      debugInfo.lastNotesReadAt = new Date();
      debugInfo.notesSource = 'sondage de secours (toutes les 3s)';
      scheduleLiveRender();
    }).catch(err => {
      console.warn('Relecture périodique (notes) impossible :', err.code, err.message);
    });
  }, 3000);
}

function manualRefresh(){
  if(!firebaseReady || isRefreshing) return;
  isRefreshing = true;
  Promise.all([
    sessionRef().get({source:'server'}).then(doc => {
      const data = doc.exists ? doc.data() : { athleteName:'', resetToken:0, final:null };
      debugInfo.lastSessionReadAt = new Date();
      applySessionData(data);
    }),
    notesRef().get({source:'server'}).then(qs => {
      const scores = {};
      qs.forEach(d => { scores[d.id] = d.data(); });
      session.scores = scores;
      debugInfo.lastNotesReadAt = new Date();
      debugInfo.notesSource = 'rafraîchissement manuel';
      render();
    })
  ]).catch(err => reportWriteError('manualRefresh', err))
    .finally(() => { isRefreshing = false; render(); });
}

function reportWriteError(label, err){
  console.error('Erreur Firestore (' + label + ') :', err.code, err.message);
  document.getElementById('topPillText').textContent = 'Écriture bloquée (' + (err.code || '?') + ')';
  document.getElementById('topPill').classList.remove('online');
  document.getElementById('topPill').classList.add('offline');
  lastFirestoreError = 'Échec d\'enregistrement [' + label + '] : ' + (err.code || '?') + ' — ' + (err.message || '');
  render();
  alert("Échec d'enregistrement Firestore [" + label + "]\nCode : " + err.code + "\nMessage : " + err.message + "\n\n→ Vérifie les règles de sécurité Firestore (Firebase Console > Firestore Database > Règles).");
}

let lastNoteSentAt = null;
let isSendingNote = false;

function hydrateJudgeFromSession(){
  lastSeenResetToken = session.resetToken;
  const existing = session.scores['j' + currentJudge];
  if(session.mode === 'sideBySide'){
    const eA = existing && existing.A ? existing.A : null;
    const eB = existing && existing.B ? existing.B : null;
    judgeStateA = (eA && eA.p1 && eA.p2) ? { phase: 1, p1: {...eA.p1, faultsLog:[]}, p2: {...eA.p2, faultsLog:[]} } : makeEmptyDoubleState();
    judgeStateB = (eB && eB.p1 && eB.p2) ? { phase: 1, p1: {...eB.p1, faultsLog:[]}, p2: {...eB.p2, faultsLog:[]} } : makeEmptyDoubleState();
    sidePhase = (existing && existing.sidePhase) ? existing.sidePhase : 1;
  } else if(session.mode === 'freestyle'){
    const ef = existing && existing.freestyle ? existing.freestyle : null;
    judgeFreestyle = ef ? { ...makeEmptyFreestyleState(), ...ef, technique: {...makeEmptyFreestyleState().technique, ...(ef.technique||{})} } : makeEmptyFreestyleState();
  } else if(existing && existing.p1 && existing.p2){
    judgeState = { phase: existing.phase || 1, p1: {...existing.p1, faultsLog:[]}, p2: {...existing.p2, faultsLog:[]} };
  } else {
    judgeState = makeEmptyDoubleState();
  }
  judgeHydrated = true;
 // Sûr maintenant: l'état reflète soit la vraie donnée déjà en base, soit un vrai départ
 // vierge confirmé par le serveur (jamais une supposition faite avant réception des données).
  writeJudgeScore();
}

function writeJudgeScore(){
  if(!firebaseReady || !currentJudge) return Promise.resolve();
  isSendingNote = true;
  const passPayload = p => ({ precision: p.precision, puissance: p.puissance, rythme: p.rythme, expression: p.expression, validated: p.validated });
  let payload;
  if(session.mode === 'sideBySide'){
    payload = {
        mode: 'sideBySide',
        A: {
          precision: avgPassField(judgeStateA,'precision'),
          puissance: avgPassField(judgeStateA,'puissance'),
          rythme: avgPassField(judgeStateA,'rythme'),
          expression: avgPassField(judgeStateA,'expression'),
          total: sideTotal(judgeStateA),
          p1: passPayload(judgeStateA.p1),
          p2: passPayload(judgeStateA.p2)
        },
        B: {
          precision: avgPassField(judgeStateB,'precision'),
          puissance: avgPassField(judgeStateB,'puissance'),
          rythme: avgPassField(judgeStateB,'rythme'),
          expression: avgPassField(judgeStateB,'expression'),
          total: sideTotal(judgeStateB),
          p1: passPayload(judgeStateB.p1),
          p2: passPayload(judgeStateB.p2)
        },
        sidePhase: sidePhase,
        validated: bothSidePassesValidated(),
        resetToken: session.resetToken,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
  } else if(session.mode === 'freestyle'){
    payload = {
        mode: 'freestyle',
        freestyle: judgeFreestyle,
        total: freestyleFinalTotal(judgeFreestyle),
        validated: judgeFreestyle.validated,
        resetToken: session.resetToken,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
  } else {
    payload = {
        mode: 'single',
        precision: avgPassField(judgeState,'precision'),
        puissance: avgPassField(judgeState,'puissance'),
        rythme: avgPassField(judgeState,'rythme'),
        expression: avgPassField(judgeState,'expression'),
        total: judgeTotal(),
        phase: judgeState.phase,
        p1: passPayload(judgeState.p1),
        p2: passPayload(judgeState.p2),
        validated: bothPassesValidated(judgeState),
        resetToken: session.resetToken,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
  }
  return notesRef().doc('j' + currentJudge).set(payload, {merge:false})
    .then(() => {
      lastNoteSentAt = new Date();
      isSendingNote = false;
      render();
    })
    .catch(err => {
      isSendingNote = false;
      reportWriteError('writeJudgeScore', err);
    });
}

// Envoi manuel explicite, déclenché par le bouton "📤 Envoyer la note" côté juge.
function sendNoteManually(){
  writeJudgeScore();

}

 session.phase = phase; // optimiste, pour un retour visuel immédiat

// Change le type de compétition (simple élimination <-> side by side). Efface l'entrée en
// cours (comme un "nouvel athlète"/"nouveau match") car les deux formats de notes sont
// incompatibles entre eux.
function setCompetitionMode(mode){
  if(!firebaseReady || mode === session.mode) return;
  const hasActivity = (session.scores && Object.keys(session.scores).length > 0) || session.final ||
    session.athleteName || session.athleteA || session.athleteB;
  if(hasActivity){
    const ok = confirm(
      "Changer de type de compétition efface l'entrée en cours (nom(s) et notes/choix des juges).\n\nContinuer ?"

  }
  const newResetToken = (session.resetToken || 0) + 1;
  const deletions = [1,2,3,4,5].map(i => notesRef().doc('j'+i).delete().catch(()=>{}));
  Promise.all(deletions).then(() => {
    sessionRef().set({
      mode,
      phase: session.phase || '',
      athleteName: '',
      athleteCategory: '',
      athleteWeight: '',
      athleteA: '',
      athleteB: '',
      athleteACategory: '',
      athleteAWeight: '',
      athleteBCategory: '',
      athleteBWeight: '',

    }, {merge:false}).catch(err => reportWriteError('setCompetitionMode', err));

const COMPETITION_TYPE_LABEL = { single: 'Notation Cut-Off', sideBySide: 'Élimination directe', freestyle: 'Notation Freestyle' };

function writeFinal(finalObj){
  if(!firebaseReady) return;
  sessionRef().set({ final: finalObj }, {merge:true})
    .catch(err => reportWriteError('writeFinal-session', err));

  const typeLabel = COMPETITION_TYPE_LABEL[finalObj.mode] || finalObj.mode;
  const phaseLabel = session.phase || '';
  const typePhase = phaseLabel ? `${typeLabel} — ${phaseLabel}` : typeLabel;

  const historyEntry = finalObj.mode === 'sideBySide'
    ? {
        mode: 'sideBySide',
        name: `${finalObj.athleteA} 🆚 ${finalObj.athleteB}`,
        typePhase,
        category: `${session.athleteACategory || '—'} / ${session.athleteBCategory || '—'}`,
        resultLabel: `${finalObj.finalA.toFixed(1)} – ${finalObj.finalB.toFixed(1)}`,
        winnerName: finalObj.winner ? finalObj.winnerName : '—',
        loserName: finalObj.winner
          ? (finalObj.winner === 'A' ? finalObj.athleteB : finalObj.athleteA)
          : `Égalité (${finalObj.athleteA} / ${finalObj.athleteB})`,
        athleteA: finalObj.athleteA,
        athleteB: finalObj.athleteB,
        finalA: finalObj.finalA,
        finalB: finalObj.finalB,
        final: null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }
    : {
        mode: 'single',
        name: finalObj.name,
        typePhase,
        category: session.athleteCategory || '—',
        resultLabel: finalObj.final.toFixed(1),
        winnerName: finalObj.name,
        loserName: '—',
        final: finalObj.final,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

  nextMatchNumber().then(matchNumber => {
    historyEntry.matchNumber = matchNumber;
    return historyRef().add(historyEntry);
  }).catch(err => reportWriteError('writeFinal-historique', err));
}

/* =========================================================
   RENDU PRINCIPAL
========================================================= */
function render(){
  const app = document.getElementById('app');
  const adminOverlayEl = document.getElementById('adminModalOverlay');
  app.classList.toggle('wrap-home', view === 'home');

 // Préserve le champ en cours de saisie (id, position du curseur) à travers le rafraîchissement,
 // pour que les mises à jour périodiques (Firestore, sondage de secours) n'interrompent jamais
 // la frappe sur "Identifiant", "Mot de passe", "Nom de l'athlète", que le champ se trouve
 // dans la vue principale ou dans la fenêtre Espace Admin.
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if(active && active.id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT') &&
     (app.contains(active) || (adminOverlayEl && adminOverlayEl.contains(active)))){
    focusId = active.id;
    selStart = active.selectionStart;
    selEnd = active.selectionEnd;
  }

  app.classList.toggle('wrap-wide', view === 'home');

  if(view === 'login'){
    app.innerHTML = renderLogin();
  } else if(view === 'home'){
    app.innerHTML = renderHome();
  } else if(view === 'judgesSpace'){
    app.innerHTML = renderJudgesSpace();
  } else if(view === 'referee'){
    app.innerHTML = renderRefereeAnnouncements();
  } else if(view === 'judge'){
    app.innerHTML = renderJudge();
  } else if(view === 'stage'){
    app.innerHTML = renderStagePage();
    syncStageDisplay();
  }

 // Fenêtre Espace Admin: rendue à part, indépendamment de la vue en cours, jamais
 // affichée aux juges ni sur l'écran central de projection.
  if(adminOverlayEl){
    if(adminModalOpen && view !== 'login'){
      adminOverlayEl.classList.add('active');
      adminOverlayEl.innerHTML = renderAdminModal();
    } else {
      adminOverlayEl.classList.remove('active');
      adminOverlayEl.innerHTML = '';
    }
  }

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(typeof selStart === 'number' && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

 // Centre automatiquement la valeur sélectionnée dans chaque menu de score
 // horizontal, pour que l'arbitre la voie sans avoir à défiler manuellement.
  document.querySelectorAll('.score-opt.active').forEach(el => {
    el.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
}

// Mini panneau compact "Envoyer un signal test" — seule action de connectivité
// accessible côté juge (le reste du diagnostic reste dans l'Espace Admin).
function renderJudgeTestSignal(){
  let status;
  if(!pingData || !pingData.sentAtMs){
    status = `<span class="status">Aucun signal envoyé</span>`;
  } else {
    const secs = Math.max(0, Math.round((Date.now() - pingData.sentAtMs) / 1000));
    const fresh = secs <= 5;
    status = `<span class="status ${fresh ? 'fresh' : ''}">${fresh ? '✅ Reçu' : 'Dernier signal : '} ${secs < 60 ? secs + 's' : Math.round(secs/60) + ' min'}</span>`;
  }
  return `
    <div class="judge-test-signal">
      <button onclick="sendTestPing()">📡 Signal test</button>
      ${status}
    </div>
  `;
}

function faultePrecisionSide(side, amount){
  const state = side === 'A' ? judgeStateA : judgeStateB;
  const pass = currentSidePass(state);
  pass.precision = clamp(round1(pass.precision - amount), 0, 4.0);
  pass.faultsLog.push(amount);
  writeJudgeScore();
  render();
}
function resetPrecisionSide(side){
  const state = side === 'A' ? judgeStateA : judgeStateB;
  const pass = currentSidePass(state);
  pass.precision = 4.0;
  pass.faultsLog = [];
  writeJudgeScore();
  render();
}
// Valide la Poomsae en cours (P1 ou P2) pour LES DEUX athlètes à la fois (ils exécutent
// leurs passes simultanément en side-by-side). Une fois P1 validé pour les deux, on
// passe à P2; une fois les deux Poomsae validées pour les deux athlètes, on envoie.
function validateSide(){
  currentSidePass(judgeStateA).validated = true;
  currentSidePass(judgeStateB).validated = true;
  if(sidePhase === 1){
    sidePhase = 2;
  }
  writeJudgeScore();
  render();
}
// "Modifier Poomsae 2": rouvre la dernière passe validée pour les deux athlètes.
function unvalidateSide(){
  judgeStateA.p2.validated = false;
  judgeStateB.p2.validated = false;
  sidePhase = 2;
  writeJudgeScore();
  render();
}
// "Modifier Poomsae 1": permet de rouvrir la première passe même après l'envoi final.
function reopenSidePass1(){
  judgeStateA.p1.validated = false;
  judgeStateB.p1.validated = false;
  sidePhase = 1;
  writeJudgeScore();
  render();
}
// Bascule d'onglet Poomsae 1 / Poomsae 2 côté side-by-side, sans rien valider.
function switchSidePass(n){
  sidePhase = n;
  render();
}

function renderPresentationItem(key,label){
  const val = currentPass(judgeState)[key];
  return `
    <div class="score-block">
      <div class="score-head">
        <h3>${label}</h3>
        <span class="max">Max 2,0 pts</span>
      </div>
      <div class="score-value">${val.toFixed(1)}</div>
      <div class="btnrow">
        <button class="btn btn-faute1" onclick="adjustPresentation('${key}',-0.1)">−0,1</button>
        <button class="btn btn-faute3" onclick="adjustPresentation('${key}',-0.3)">−0,3</button>
        <button class="btn btn-plus" onclick="adjustPresentation('${key}',0.1)">+0,1</button>
        <button class="btn btn-minus" onclick="adjustPresentation('${key}',2.0 - val)" title="Remettre à 2,0">↺ 2,0</button>
      </div>
    </div>
  `;
}

function faultePrecision(amount){
  const pass = currentPass(judgeState);
  pass.precision = clamp(round1(pass.precision - amount), 0, 4.0);
  pass.faultsLog.push(amount);
  writeJudgeScore();
  render();
}
function resetPrecision(){
  const pass = currentPass(judgeState);
  pass.precision = 4.0;
  pass.faultsLog = [];
  writeJudgeScore();
  render();
}
function adjustPresentation(key, delta){
  const pass = currentPass(judgeState);
  pass[key] = clamp(round1(pass[key] + delta), 0, 2.0);
  writeJudgeScore();
  render();
}
// Valide la passe en cours (P1 ou P2). Une fois P1 validé, on passe automatiquement à P2.
// Une fois les DEUX validés, la moyenne P1/P2 est calculée et envoyée à l'admin.
function validateJudge(){
  currentPass(judgeState).validated = true;
  if(judgeState.phase === 1 && !judgeState.p2.validated){
    judgeState.phase = 2;
  }
  writeJudgeScore();
  render();
}
// "Modifier la note": rouvre la dernière passe validée (P2 si les deux sont faites, sinon P1).
function unvalidate(){
  if(judgeState.p2.validated){
    judgeState.p2.validated = false;
    judgeState.phase = 2;
  } else {
    judgeState.p1.validated = false;
    judgeState.phase = 1;
  }
  writeJudgeScore();
  render();
}
// Permet de rouvrir aussi P1 après coup (depuis l'écran récapitulatif une fois les 2 envoyées).
function reopenPass1(){
  judgeState.p1.validated = false;
  judgeState.phase = 1;
  writeJudgeScore();
  render();
}
// Bascule d'onglet Poomsae 1 / Poomsae 2 sans rien valider — permet de revoir/corriger
// une passe déjà remplie avant l'envoi final.
function switchPass(n){
  judgeState.phase = n;
  render();
}

// Supprime tout l'historique synchronisé (jusqu'à 500 entrées par lot) après confirmation.
function resetHistory(){
  if(!firebaseReady) return;
  const ok = confirm("Réinitialiser l'historique effacera définitivement tous les matchs enregistrés.\n\nContinuer ?");
  if(!ok) return;
  historyRef().limit(500).get().then(snap => {
    const batch = db.batch();
    snap.forEach(d => batch.delete(d.ref));
    return batch.commit();
  }).then(() => {
    history = [];
    render();
  }).catch(err => reportWriteError('resetHistory', err));
}

// Ouvre une fenêtre imprimable avec le tableau d'historique actuellement chargé.
function printHistory(){
  const rows = history.map(h => `

      <td>${h.matchNumber != null ? h.matchNumber : '—'}</td>
      <td>${escapeHtml(h.name || '—')}</td>
      <td>${escapeHtml(h.typePhase || (COMPETITION_TYPE_LABEL[h.mode] || h.mode || '—'))}</td>
      <td>${escapeHtml(h.resultLabel != null ? String(h.resultLabel) : (typeof h.final === 'number' ? h.final.toFixed(1) : '—'))}</td>
      <td>${escapeHtml(h.winnerName || '—')}</td>
      <td>${escapeHtml(h.loserName || '—')}</td>
    </tr>
  `).join('');
  const html = `
    <!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
    <title>Historique — Ligue de Dakar Taekwondo</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#111;}
      h1{font-size:18px;margin-bottom:4px;}
      p{font-size:12px;color:#555;margin-top:0;}
      table{width:100%;border-collapse:collapse;margin-top:14px;}
      th,td{border:1px solid #ccc;padding:6px 8px;font-size:12px;text-align:left;}
      th{background:#f0f0f0;}
    </style></head><body>
    <h1>Historique — Ligue de Dakar Taekwondo</h1>
    <p>Imprimé le ${new Date().toLocaleString('fr-FR')}</p>
    <table>
      <tr><th>N°</th><th>Athlète(s)</th><th>Type — Phase</th><th>Résultat (pts)</th><th>Vainqueur</th><th>Vaincu</th></tr>
      ${rows || '<tr><td colspan="6">Pas encore de match enregistre.</td></tr>'}
    </table>
    </body></html>
  `;
  const w = window.open('', '_blank');
  if(!w){ alert("Impossible d'ouvrir la fenêtre d'impression (bloqueur de popup ?)."); return; }
  w.document.write(html);
  w.document.close();
  w.focus();
  w.print();
}

function calculateFinal(){
  const scores = session.scores || {};
  const valid = [1,2,3,4,5].map(i => scores['j'+i]).filter(s => s && s.validated).map(s => s.total);
  if(valid.length < 5){
    alert('Les 5 juges doivent valider leur note avant le calcul final.');
    return;
  }
  const sorted = [...valid].sort((a,b)=>a-b);
  const dropped = [sorted[0], sorted[sorted.length-1]];
  const kept = sorted.slice(1, sorted.length-1);
  const final = round1(kept.reduce((a,b)=>a+b,0) / kept.length);

  writeFinal({ mode: session.mode === 'freestyle' ? 'freestyle' : 'single', name: session.athleteName, final, kept, dropped });
}

function calculateFinalPick(){
  const scores = session.scores || {};
  const entries = [1,2,3,4,5].map(i => scores['j'+i]).filter(s => s && s.validated && s.A && s.B);
  if(entries.length < 5){
    alert('Les 5 juges doivent valider leurs notes avant de calculer le résultat.');
    return;
  }
  const trim = arr => {
    const sorted = [...arr].sort((a,b)=>a-b);
    const dropped = [sorted[0], sorted[sorted.length-1]];
    const kept = sorted.slice(1, sorted.length-1);
    return { final: round1(kept.reduce((a,b)=>a+b,0) / kept.length), kept, dropped };
  };
  const presentationOf = s => round1(s.puissance + s.rythme + s.expression);

  const rA = trim(entries.map(s => s.A.total));
  const rB = trim(entries.map(s => s.B.total));
  const accA = trim(entries.map(s => s.A.precision));
  const accB = trim(entries.map(s => s.B.precision));
  const presA = trim(entries.map(s => presentationOf(s.A)));
  const presB = trim(entries.map(s => presentationOf(s.B)));

  let winner = null;
  let tieBreak = null;
  if(rA.final > rB.final) winner = 'A';
  else if(rB.final > rA.final) winner = 'B';
  else if(accA.final > accB.final){ winner = 'A'; tieBreak = 'accuracy'; }
  else if(accB.final > accA.final){ winner = 'B'; tieBreak = 'accuracy'; }
  else if(presA.final > presB.final){ winner = 'A'; tieBreak = 'presentation'; }
  else if(presB.final > presA.final){ winner = 'B'; tieBreak = 'presentation'; }
 // Si toujours égal après les deux départages, égalité totale (winner reste null).

  const winnerName = winner === 'A' ? (session.athleteA || 'Athlète A')
    : (winner === 'B' ? (session.athleteB || 'Athlète B') : 'Égalité');

  const judgesDetail = entries.map(s => ({
    A: { precision: round1(s.A.precision), presentation: presentationOf(s.A) },
    B: { precision: round1(s.B.precision), presentation: presentationOf(s.B) }
  }));

  nextMatchNumber().then(matchNumber => {
    writeFinal({
      mode: 'sideBySide',
      matchNumber,
      round: sidePhase,
      poomsaeR1: session.poomsaeR1 || '',
      poomsaeR2: session.poomsaeR2 || '',
      athleteA: session.athleteA,
      athleteB: session.athleteB,
      winner,
      winnerName,
      tieBreak,
      finalA: rA.final, keptA: rA.kept, droppedA: rA.dropped,
      finalB: rB.final, keptB: rB.kept, droppedB: rB.dropped,
      accuracyA: accA.final, accuracyB: accB.final,
      presentationA: presA.final, presentationB: presB.final,
      judgesDetail
    });
  }).catch(err => reportWriteError('nextMatchNumber-sbs', err));
}

function openStage(){
  if(!session.final) return;
  const f = session.final;
  let html;
  if(f.mode === 'sideBySide'){
    const jd = f.judgesDetail || [];
    const jRowsA = jd.map((j,i) => `<div class="sb-jrow"><span class="sb-jnum">${i+1}</span><span class="sb-jval acc">${j.A.precision.toFixed(1)}</span><span class="sb-jval pres">${j.A.presentation.toFixed(1)}</span></div>`).join('');
    const jRowsB = jd.map((j,i) => `<div class="sb-jrow"><span class="sb-jval pres">${j.B.presentation.toFixed(1)}</span><span class="sb-jval acc">${j.B.precision.toFixed(1)}</span><span class="sb-jnum">${i+1}</span></div>`).join('');
    html = `
      <div class="sb-board">
        <div class="sb-topbar">
          <span class="sb-round">${f.round === 2 ? 'R2' : 'R1'}</span>
          <span id="stageChronoCenter">0:00.0</span>
          <span>${f.matchNumber != null ? '#' + f.matchNumber : ''}</span>
        </div>
        <div class="sb-headers">
          <div class="sb-head a"><span class="sb-flag">🇸🇳</span> ${escapeHtml(f.athleteA || 'Athlète A')}</div>
          <div class="sb-head b">${escapeHtml(f.athleteB || 'Athlète B')} <span class="sb-flag">🇸🇳</span></div>
        </div>
        <div class="sb-mid">
          <div class="sb-avgcol a"><div class="sb-avg">${f.finalA.toFixed(3)}</div><div class="sb-avglabel">Average</div></div>
          <div class="sb-judges">${jRowsA}</div>
          <div class="sb-judges">${jRowsB}</div>
          <div class="sb-avgcol b"><div class="sb-avg">${f.finalB.toFixed(3)}</div><div class="sb-avglabel">Average</div></div>
        </div>
        <div class="sb-summary">
          <div class="sb-sumcol"><span class="acc">Accuracy<br><b>${f.accuracyA.toFixed(1)}</b></span><span class="tot">Total<br><b>${f.finalA.toFixed(1)}</b></span><span class="pres">Presentation<br><b>${f.presentationA.toFixed(1)}</b></span></div>
          <div class="sb-sumcol"><span class="acc">Accuracy<br><b>${f.accuracyB.toFixed(1)}</b></span><span class="tot">Total<br><b>${f.finalB.toFixed(1)}</b></span><span class="pres">Presentation<br><b>${f.presentationB.toFixed(1)}</b></span></div>
        </div>
        <div class="sb-botbar">
          <div class="sb-poomsae ${f.round===2 ? 'dim' : ''}"><span class="rlabel">R1</span> ${escapeHtml(f.poomsaeR1 || '—')}</div>
          <div class="sb-poomsae ${f.round===1 ? 'dim' : ''}">${escapeHtml(f.poomsaeR2 || '—')} <span class="rlabel">R2</span></div>
        </div>
      </div>
      <div class="sb-winnerbar">${f.winner ? '🏆 Winner : ' + escapeHtml(f.winnerName) : '🤝 Égalité'}</div>
    `;
  } else {
    html = `
      <div class="athlete-name">${escapeHtml(f.name || 'Athlète')}</div>
      <div class="final">${f.final.toFixed(1)}</div>
      <div class="final-label">Note finale</div>
      <div class="breakdown">
        ${f.kept.map(v => `<span class="bd-item bd-kept">${v.toFixed(1)}</span>`).join('')}
        ${f.dropped.map(v => `<span class="bd-item bd-dropped">${v.toFixed(1)}</span>`).join('')}
      </div>
    `;
  }
  document.getElementById('stageContent').innerHTML = html;
  document.getElementById('stage').classList.toggle('has-scoreboard', f.mode === 'sideBySide');
  if(f.mode === 'sideBySide'){ ensureChronoTick(); updateChronoDisplays(); }
  setStageActive(true);
  render();
}
function closeStage(){
  setStageActive(false);
  render();
}

// Page dédiée "Écran central" (device séparé branché au projecteur).
function goStage(){
  view = 'stage';
  render();
}

// Contenu affiché derrière l'overlay plein écran, au cas où l'overlay serait fermé.
function renderStagePage(){
  return `
    <div class="card" style="text-align:center;padding:60px 22px;">
      <div style="font-size:15px;color:#4b5563;font-weight:700;">🖥️ Écran central ${stagePowerOn ? 'actif' : 'réduit'}</div>
      <p style="font-size:13px;color:#9098a3;margin-top:10px;line-height:1.6;">
        Cet appareil projette en direct le chrono et les résultats de la compétition.
      </p>
      ${!stagePowerOn ? `<button class="btn-new" style="margin-top:16px;" onclick="syncStageDisplay()">🖥️ Restaurer l'écran</button>` : ''}
    </div>
  `;
}

// Met à jour l'overlay plein écran selon l'état courant (chrono ou résultat final),
// sans changer de vue ni relancer render() en boucle.
function syncStageDisplay(){
  setStageActive(true);
  if(session.final){
    openStage();
  } else if(session.mode === 'sideBySide' && (session.athleteA || session.athleteB)){
    const judgeNums = Array.from({length:7}, (_,i) => `<div class="jp-num">${i+1}</div>`).join('');
    document.getElementById('stageContent').innerHTML = `
      <div class="jp-board">
        <div class="jp-col red"><div class="jp-name">${escapeHtml(session.athleteA || 'Athlète A')}</div></div>
        <div class="jp-judges">${judgeNums}</div>
        <div class="jp-col blue"><div class="jp-name">${escapeHtml(session.athleteB || 'Athlète B')}</div></div>
      </div>
      <div class="final-label" style="margin-top:20px;">Temps d'exécution</div>
      <div class="jp-big-chrono" id="stageBigChrono">0:00.0</div>
    `;
    ensureChronoTick();
    updateChronoDisplays();
  } else if(session.athleteName || session.athleteA || session.athleteB){
    document.getElementById('stageContent').innerHTML = `
      <div class="athlete-name">${session.athleteName ? escapeHtml(session.athleteName) : "En attente de l'athlète"}</div>
      <div class="final-label" style="margin-top:-18px;margin-bottom:10px;">Temps d'exécution</div>
      <div class="jp-big-chrono" id="stageBigChrono">0:00.0</div>
    `;
    ensureChronoTick();
    updateChronoDisplays();
  } else {
    document.getElementById('stageContent').innerHTML = `<div class="waiting">En attente du prochain athlète…</div>`;
  }
}

// Bouton "← Retour" affiché sur l'écran central: ferme l'overlay et revient à l'accueil.
function stageBackHome(){
  if(document.fullscreenElement) document.exitFullscreen();
  setStageActive(false);
  view = 'home';
  render();
}

// Réduire: masque l'overlay plein écran mais reste sur la page "Écran central"
// (avec un bouton pour le rouvrir), sans revenir à l'accueil.
function minimizeStage(){
  if(document.fullscreenElement) document.exitFullscreen();
  setStageActive(false);
  render();
}

// Agrandir/restaurer: bascule le vrai plein écran du navigateur (idéal pour un
// vidéoprojecteur — masque aussi la barre d'adresse).
function toggleStageFullscreen(){
  const stageEl = document.getElementById('stage');
  if(document.fullscreenElement){
    document.exitFullscreen();
  } else if(stageEl.requestFullscreen){
    stageEl.requestFullscreen().catch(() => {});
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

initFirebase();
render();
</script>
